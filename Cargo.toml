[package]
name = "gbae"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "A Game Boy Advance emulator"
repository = "https://github.com/Japabu/gbae"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gbae"
path = "src/main.rs"
required-features = ["frontend"]

[features]
default = ["frontend"]
frontend = ["dep:winit", "dep:softbuffer", "dep:cpal"]

[dependencies]
winit = { git = "https://github.com/ToyOSOrg/winit", branch = "toyos-0.31.0-beta.2-sdk-0.2", optional = true, default-features = false }
softbuffer = { git = "https://github.com/ToyOSOrg/softbuffer", branch = "toyos-0.4.8-sdk-0.2", optional = true, default-features = false }
cpal = { git = "https://github.com/ToyOSOrg/cpal", branch = "toyos-0.18.0-sdk-0.2", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { git = "https://github.com/ToyOSOrg/winit", branch = "toyos-0.31.0-beta.2-sdk-0.2", optional = true, default-features = false, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = { git = "https://github.com/ToyOSOrg/softbuffer", branch = "toyos-0.4.8-sdk-0.2", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

[patch.crates-io]
raw-window-handle = { git = "https://github.com/ToyOSOrg/raw-window-handle", branch = "toyos-0.6.2" }

[profile.dev]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
