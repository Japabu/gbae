[package]
name = "gbae"
version = "0.1.0"
edition = "2021"

[dependencies]
lazy_static = "1.4.0"
pixels = "0.15.0"
winit = "0.30.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.24"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
image = "0.25"
